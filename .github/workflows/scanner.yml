name: NSE Stock Scanner

on:
  schedule:
    - cron: '30 16 * * *'
    - cron: '30 0 * * *'
    - cron: '35 0 * * *'
    - cron: '55 3 * * 1-5'
    - cron: '0 4 * * 1-5'
    - cron: '0 5 * * 1-5'
    - cron: '0 6 * * 1-5'
    - cron: '0 7 * * 1-5'
    - cron: '0 8 * * 1-5'
    - cron: '0 9 * * 1-5'
    - cron: '45 9 * * 1-5'

  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Scan type to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - swing
          - intraday
          - gold_nifty

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # ← YEH LINE ADD KARO (IMPORTANT)
      
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
     
      
     
